[package]
name = "flydigi-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "system_fonts", "wayland", "x11"] }
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
env_logger = "0.11.11"
flydigi-core = { version = "0.1.0", path = "../flydigi-core" }
flydigi-proto = { version = "0.1.0", path = "../flydigi-proto" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.1"
